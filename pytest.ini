[pytest]
testpaths = tests
addopts = -v --html=reports/test_report.html --self-contained-html
markers =
    web: Web payment automation tests (Playwright)
    mobile: Mobile Android payment automation tests (Appium)
    smoke: Lightweight framework verification and critical smoke tests
    bonus: End-to-end OTP automation and transaction completion tests
    e2e: End-to-end payment completion tests past 2FA/OTP
    p0: Critical checkout and Card/UPI blocker tests
    p1: Secondary payment methods such as Netbanking and amount integrity checks
    p2: Negative validation and edge-case tests
    regression: Full regression test suite
